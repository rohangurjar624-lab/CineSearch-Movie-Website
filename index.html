<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineSearch - Movie Search Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header / Navigation -->
    <header class="navbar">

        <div class="logo">
            🎬 CineSearch
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
            <a href="#favorites">Favorites</a>
        </nav>

    </header>


    <!-- Hero Section -->
    <section class="hero" id="home">

        <h1>Discover Your Next Favorite Movie 🎬</h1>

        <p>
            Search movies, explore genres and save your favorites.
        </p>


        <!-- Search Box -->
        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a movie..."
            >

            <button id="searchButton">
                Search
            </button>

        </div>

    </section>


    <!-- Genre Filter -->
    <section class="filter-section">

        <h2>Browse Movies</h2>

        <div class="genre-buttons">

            <button class="genre-btn active" data-genre="All">
                All
            </button>

            <button class="genre-btn" data-genre="Action">
                Action
            </button>

            <button class="genre-btn" data-genre="Comedy">
                Comedy
            </button>

            <button class="genre-btn" data-genre="Drama">
                Drama
            </button>

            <button class="genre-btn" data-genre="Sci-Fi">
                Sci-Fi
            </button>

        </div>

    </section>


    <!-- Movies Section -->
    <main id="movies" class="movies-section">

        <h2>Popular Movies</h2>

        <div id="movieContainer" class="movie-container">

            <!-- Movie cards will be added using JavaScript -->

        </div>

    </main>


    <!-- Favorites Section -->
    <section id="favorites" class="favorites-section">

        <h2>❤️ My Favorite Movies</h2>

        <div id="favoriteContainer" class="movie-container">

            <p id="emptyFavoriteMessage">
                No favorite movies added yet.
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 CineSearch | Final Web Development Project
        </p>

    </footer>
    <!-- Movie Details Modal -->

<div id="movieModal" class="modal">

    <div class="modal-content">

        <span id="closeModal" class="close-btn">
            &times;
        </span>

        <div id="modalDetails">

            <!-- Movie details will appear here -->

        </div>

    </div>

</div>


    <script src="script.js"></script>

</body>

</html>
